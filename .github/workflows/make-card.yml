name: make-card
on:
  push:
    branches: [main]
    paths: ["requests/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: make-card, cancel-in-progress: false}
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0
      - run: pip install -q pillow
      - name: Render pending cards
        run: |
          python3 - <<'PY'
          import json, glob, os, subprocess
          from PIL import Image
          for req in sorted(glob.glob("requests/*.json")):
              r = json.load(open(req, encoding="utf-8"))
              s = r["slug"]
              jpg = f"cards/{s[:7]}/{s[8:]}.jpg"
              if os.path.exists(jpg):
                  continue
              os.makedirs(os.path.dirname(jpg), exist_ok=True)
              png = jpg[:-4] + ".png"
              subprocess.run(["python3", "make_card.py", r["headline"], r["category"], r["date"], png], check=True)
              Image.open(png).convert("RGB").save(jpg, "JPEG", quality=92)
              print("rendered", jpg)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet && exit 0
          git commit -m "cards"
          git pull --rebase -q origin main
          git push origin HEAD:main
