name: make-card
on:
  push:
    branches: [main]
    paths: ["requests/**.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: make-card, cancel-in-progress: false}
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Ensure raqm (Arabic shaping)
        timeout-minutes: 6
        run: |
          ok() { python3 -c "import sys; from PIL import features; sys.exit(0 if features.check('raqm') else 1)"; }
          if ok; then echo "raqm already available"; exit 0; fi
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq || true
            if sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq libraqm0 && ok; then exit 0; fi
            echo "apt attempt $i failed, retrying in 30s"; sleep 30
          done
          exit 1
      - name: Render pending cards
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, glob, os, subprocess, urllib.error, urllib.parse, urllib.request
          from PIL import Image

          def pixabay_photo(query, dest):
              """Download the top Pixabay photo for an English query; None on any failure."""
              key = os.environ.get("PIXABAY_API_KEY")
              if not key or not query:
                  return None
              try:
                  url = "https://pixabay.com/api/?" + urllib.parse.urlencode({
                      "key": key, "q": query[:100], "image_type": "photo", "safesearch": "true",
                      "min_width": 1000, "per_page": 5, "order": "popular"})
                  ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) news-cards/1.0"}
                  try:
                      hits = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=20)).get("hits", [])
                  except urllib.error.HTTPError as e:
                      print("pixabay search failed:", e.code, e.read()[:200]); return None
                  if not hits:
                      print("no pixabay hits for", query); return None
                  h = hits[0]
                  req = urllib.request.Request(h["largeImageURL"], headers=ua)
                  open(dest, "wb").write(urllib.request.urlopen(req, timeout=30).read())
                  print("pixabay photo", h["id"], "by", h.get("user"), "for", query)
                  return dest
              except Exception as e:
                  print("pixabay failed:", e); return None

          for req in sorted(glob.glob("requests/*.json")):
              r = json.load(open(req, encoding="utf-8"))
              s = r["slug"]
              jpg = f"cards/{s[:7]}/{s[8:]}.jpg"
              if os.path.exists(jpg):
                  continue
              os.makedirs(os.path.dirname(jpg), exist_ok=True)
              png = jpg[:-4] + ".png"
              args = ["python3", "make_card.py", r["headline"], r["category"], r["date"], png]
              bg = pixabay_photo(r.get("image_query", ""), "/tmp/bg.jpg")
              if bg:
                  args.append(bg)
              subprocess.run(args, check=True)
              Image.open(png).convert("RGB").save(jpg, "JPEG", quality=92)
              print("rendered", jpg)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet && exit 0
          git commit -m "cards"
          git pull --rebase -q origin main
          git push origin HEAD:main
